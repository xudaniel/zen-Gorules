name: Alien Immigration Demo
on:
  push:
    branches: [master]
    paths:
      - 'examples/alien-immigration/**'
      - '.github/workflows/alien-immigration-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alien-immigration-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'xudaniel/zen-Gorules'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/alien-immigration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/alien-immigration/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
